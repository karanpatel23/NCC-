<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="NCC Infraspace">
  <!--
    R2 §4 favicon spec: N monogram, --paper on --indigo, square, NO radius.

    The Nataraja explicitly CANNOT be the favicon — at 16px and 32px its detail
    (the arch of flames, the individual arms) becomes noise. R2 §4 is direct
    about this. The monogram carries the mark at small sizes; the statue only
    appears in the full lockup.

    ⚠️ PENDING R5 §4 DECISION. This uses #3B498C, the exact logo blue — which
    R5 withdrew from the token system. The mark is therefore off-palette: on
    the site's own --navy (#112532) the logo blue measures 1.89:1, essentially
    invisible, which is the "two blues collision" R5 §4 describes.

    Deliberately NOT recoloured here. R5 §4 offers three routes and recolouring
    the wordmark is option 2, a brand decision needing the client's sign-off.
    Changing a company's mark without that is not ours to do. Option 1 (mono
    lockup on dark surfaces) is the recommendation and needs no permission, but
    it concerns the LOCKUP, not this monogram.

    Resolve §4, then revisit. R9: the stroke is pure white; the
    #3B498C ground is the part still waiting on that brand decision.

    Square with no radius, per R2 and the sitewide "infrastructure isn't soft"
    rule. The only rounded thing on this site is the map pin.
  -->
  <rect width="64" height="64" fill="#3B498C"/>
  <path
    d="M19 46 V18 L45 46 V18"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="7"
    stroke-linecap="butt"
    stroke-linejoin="miter"
  />
</svg>
